<div>
    <div class="from-table">
        <div class="from-field">
            <label class="from-field-label">名称</label>
            <input type="text" name="name" value="${param.name || ''}"/>
        </div>
        <div class="from-field">
            <label class="from-field-label">地址</label>
            <input type="text" name="host" value="${param.host || ''}"/>
        </div>
        <div class="from-field">
            <label class="from-field-label">端口</label>
            <input type="text" name="port" value="${param.port || ''}"/>
        </div>
        <div class="from-field">
            <label class="from-field-label">密码</label>
            <input type="text" name="password" value="${param.password || ''}"/>
        </div>
    </div>
</div>
