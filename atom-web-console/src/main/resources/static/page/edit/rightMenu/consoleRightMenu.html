<style>
    #consoleRightMenu {
        /*padding: 5px 10px;*/
    }
</style>
<div id="consoleRightMenu" class="right-menu button-container-column">
    <div class="button-container-btn2"
         onmouseover="atomPage.clearRightChildMenu()"
         onclick="atomPage.deleteFile('EXECUTE_ORD', atomPage.executeConsole)"
    >删除</div>
    <div class="button-container-btn2"
         onmouseover="atom.SPA.loadHtml('/page/edit/rightMenu/consoleRightChildMenu.html')
        .then(html => {
            // 移除上一次的子菜单
            atomPage.clearRightChildMenu()
            // 打开子菜单
            atomPage.openChildBlock(event, html)
        })"
    >新增
    </div>
</div>
