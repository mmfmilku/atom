<style>
    .edit-frame {
        height: 80vh;
        /*background-color: darkgray;*/
    }

    /* 操作按钮栏 */
    .edit-operate-bar {
        /* 上下  左右 */
        margin: 4px 1%;
        background-color: gray;
    }

    .edit-left-bar-content {
        /* 设置高度，左侧使用滚动条 */
        height: 100%;
    }

    .edit-area {
        height: 100%;
    }

    .edit-left-bar {
        margin-left: 1%;
        margin-right: 1%;
        background-color: gray;
        /* 左侧文件列表，占整体的宽度为20% */
        width: 20%;
    }

    .edit-left-bar-operate {
        background-color: #545454;
    }

    .edit-file-list {
        padding-left: 1%;
        padding-right: 1%;
        background-color: gray;
        /* 高度设置为100%，为了保证右键事件触发范围 */
        height: 100%;
    }

    .edit-file {
        /* 上下4px 左右0*/
        margin: 4px 0;
        width: 94%;
        /*内边距*/
        padding: 0 3%;
    }

    .edit-file:hover {
        background-color: #767676;
    }

    .edit-file-select {
        background-color: #545454!important;
    }

    .edit-code-title {
        text-align: center;
        width: 90%;
        height: 25px;
        color: #50802a;
        font-weight: 800;
    }

    .edit-code-desc {
        color: red;
        width: 10%;
        height: 28px;
        display: flex;
        justify-content: end;
    }

    .edit-code-desc > button {
        /* 上下  左右 */
        margin: 1px 2px;
        color: red;
    }

    .edit-code-box {
        width: 77%;
    }

    .ord-running {
        color: #5fcf84;
    }

    .javaList {
        width: 70vh;
        height: 450px;
    }

    .terminal-his-line {
        border-bottom-style: solid;
        border-width: thin;
        margin-top: 5px;
        padding: 5px;
        border-color: black;
        white-space: pre-wrap;
    }

    #editorContainer {
        height: 94%;
        width: 100%;
    }


</style>
<div id="page-edit">
    <div>
        <h1 class="edit-title">loading</h1>
        <div class="edit-frame">
            <div class="edit-operate-bar hide">
                <div class="vm-button-container">
                    <div title="连接" action-click="loadAgent" class="clickable agent-stop hide btn">
                        <svg viewBox="0 0 24 24" fill="none">
                            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"
                                  stroke="#1abc9c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"
                                  stroke="#1abc9c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div title="断开" action-click="stopAgent" class="clickable agent-run hide btn">
                        <svg viewBox="0 0 24 24" fill="none">
                            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"
                                  stroke="#e74c3c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"
                                  stroke="#e74c3c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M4 4l16 16" stroke="#e74c3c" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <div title="设置" action-click="configView" class="clickable btn">
                        <svg viewBox="0 0 24 24" fill="none">
                            <circle cx="12" cy="12" r="3" fill="#ffffff"/>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
                                  stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div title="日志" action-click="showLog" class="clickable agent-run hide btn">
                        <svg viewBox="0 0 24 24" fill="none">
                            <path d="M21 10H7M21 6H3M21 14H3M21 18H7" stroke="#2c3e50" stroke-width="2" stroke-linecap="round"/>
                            <rect x="3" y="3" width="18" height="18" rx="2" stroke="#2c3e50" stroke-width="2" fill="none"/>
                        </svg>
                    </div>
                    <div title="状态信息" action-click="agentInfo" class="clickable agent-run hide btn">
                        <svg viewBox="0 0 24 24" fill="none">
                            <path d="M8 7h12M8 12h12M8 17h12M4 7v0M4 12v0M4 17v0" stroke="#8e44ad" stroke-width="2" stroke-linecap="round"/>
                            <circle cx="4" cy="7" r="1.5" fill="#8e44ad"/>
                            <circle cx="4" cy="12" r="1.5" fill="#8e44ad"/>
                            <circle cx="4" cy="17" r="1.5" fill="#8e44ad"/>
                        </svg>
                    </div>
                </div>
            </div>
            <div class="flex-row edit-area">
                <div class="flex-column edit-left-bar">
                    <div class="edit-left-bar-operate agent-run hide">
                        <div class="button-container-center">
                            <div class="clickable button-container-btn button-container-select listClassBtn" action-click="listClass">类列表</div>
                            <div class="clickable button-container-btn listFileBtn" action-click="listFile">重写列表</div>
                            <div class="clickable button-container-btn listStrategyBtn" action-click="listStrategy">重写策略</div>
                            <div class="clickable button-container-btn executeConsoleBtn" action-click="executeConsole">控制台</div>
                        </div>
                    </div>
                    <div class="edit-left-bar-content scrollable-y">
                        <div class="edit-file-list listClass hide flex-column"></div>
                        <div class="edit-file-list listFile hide flex-column"></div>
                        <div class="edit-file-list listStrategy hide flex-column"></div>
                        <div class="edit-file-list executeConsole hide flex-column" rightClickEvent="consoleRightMenuNew"></div>
                    </div>
                </div>
                <div class="edit-code-box">
                    <div class="flex-row">
                        <div class="edit-code-title" for="ordFileText"></div>
                        <div class="edit-code-desc">
                        </div>
                    </div>
                    <div class="terminal-box scrollable-y"></div>
                    <div id="editorContainer" class="agent-run hide">
                    </div>
                    <div class="flex-column agent-stop hide"
                         style="height: 94%;
                        width: 100%;
                        background-color: gray;">
                        <h1 class="text-err">未连接</h1>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
