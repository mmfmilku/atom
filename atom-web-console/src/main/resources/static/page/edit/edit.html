<style>
    .edit-frame {
        height: 80vh;
        /*background-color: darkgray;*/
    }

    /* 操作按钮栏 */
    .edit-operate-bar {
        /* 上下  左右 */
        margin: 4px 1%;
        background-color: gray;
    }

    .edit-left-bar-content {
        /* 设置高度，左侧使用滚动条 */
        height: 100%;
    }

    .edit-area {
        height: 100%;
    }

    .edit-left-bar {
        margin-left: 1%;
        margin-right: 1%;
        background-color: gray;
        /* 左侧文件列表，占整体的宽度为20% */
        width: 20%;
    }

    .edit-left-bar-operate {
        background-color: #545454;
    }

    .edit-file-list {
        padding-left: 1%;
        padding-right: 1%;
        background-color: gray;
        /* 高度设置为100%，为了保证右键事件触发范围 */
        height: 100%;
    }

    .edit-file {
        /* 上下4px 左右0*/
        margin: 4px 0;
        width: 94%;
        /*内边距*/
        padding: 0 3%;
    }

    .edit-file:hover {
        background-color: #767676;
    }

    .edit-file-select {
        background-color: #545454!important;
    }

    .edit-code-title {
        text-align: center;
        width: 90%;
        height: 25px;
        color: #50802a;
        font-weight: 800;
    }

    .edit-code-desc {
        color: red;
        width: 10%;
        display: flex;
        justify-content: end;
    }

    .edit-code-desc > button {
        /* 上下  左右 */
        margin: 1px 2px;
        color: red;
    }

    .edit-code-box {
        width: 77%;
    }

    .ord-running {
        color: #5fcf84;
    }

    .javaList {
        width: 70vh;
        height: 450px;
    }

    .terminal-his-line {
        border-bottom-style: solid;
        border-width: thin;
        margin-top: 5px;
        padding: 5px;
        border-color: black;
        white-space: pre-wrap;
    }

    #editorContainer {
        height: 94%;
        width: 100%;
    }


</style>
<div id="page-edit">
    <div>
        <h1 class="edit-title">loading</h1>
        <div class="edit-frame">
            <div class="edit-operate-bar hide">
                <div class="vm-button-container">
                    <button action-click="configView">设置</button>
                    <button class="agent-run hide" action-click="showLog">日志</button>
                    <button class="agent-stop hide" id="loadAgentBtn" action-click="loadAgent">载入</button>
                    <button class="agent-run hide" id="stopAgentBtn" action-click="stopAgent">终止</button>
                    <button class="agent-run hide" action-click="agentInfo">状态</button>
                </div>
            </div>
            <div class="flex-row edit-area">
                <div class="flex-column edit-left-bar">
                    <div class="edit-left-bar-operate agent-run hide">
                        <div class="button-container-center">
                            <div class="button-container-btn button-container-select listClassBtn" action-click="listClass">类列表</div>
                            <div class="button-container-btn listFileBtn" action-click="listFile">重写列表</div>
                            <div class="button-container-btn listStrategyBtn" action-click="listStrategy">重写策略</div>
                            <div class="button-container-btn executeConsoleBtn" action-click="executeConsole">控制台</div>
                        </div>
                    </div>
                    <div class="edit-left-bar-content scrollable-y">
                        <div class="edit-file-list listClass hide flex-column"></div>
                        <div class="edit-file-list listFile hide flex-column"></div>
                        <div class="edit-file-list listStrategy hide flex-column"></div>
                        <div class="edit-file-list executeConsole hide flex-column" rightClickEvent="consoleRightMenuNew"></div>
                    </div>
                </div>
                <div class="edit-code-box">
                    <div class="flex-row">
                        <div class="edit-code-title" for="ordFileText"></div>
                        <div class="edit-code-desc">
                        </div>
                    </div>
                    <div class="terminal-box scrollable-y"></div>
                    <div id="editorContainer">
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
